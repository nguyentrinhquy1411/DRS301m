[project]
name = "dsr301m"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.6.0",
    "opencv-python>=4.10.0",
    "streamlit>=1.40.0",
    "tqdm>=4.67.0",
    "mediapipe>=1.1.0",
    "hsemotion>=0.3.0",
    "timm>=1.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

